name: Validate and publish sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - run: npm ci --ignore-scripts
      - name: Check JavaScript and fixture regressions
        run: |
          for source in sources/*/venera.js; do node --check "$source"; done
          npm test
      - name: Test and format Rust sources
        run: |
          for source in sources/*/aidoku/Cargo.toml; do
            cargo fmt --manifest-path "$source" -- --check
            cargo test --locked --manifest-path "$source"
          done
      - name: Build WASM packages and verify catalogs
        run: |
          python scripts/build.py
          git diff --exit-code -- index.json aidoku/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: aidoku-packages
          path: dist/*.aix
          if-no-files-found: error

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: aidoku-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aidoku-packages
          path: dist
      - name: Publish versioned Aidoku packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for package in dist/*.aix; do
            filename=$(basename "$package")
            tag="aidoku-${filename%.aix}"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$package" --target "$GITHUB_SHA" --title "$tag" --notes "Aidoku source package. See README for installation and test status."
            fi
          done
